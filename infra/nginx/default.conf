server_tokens off;

server {
  listen 80;
  server_name _;

  # Default body limit on ordinary routes (§6.2 / §6.6.1).
  client_max_body_size 1m;
  client_body_timeout 30s;

  # Upfront streaming upload location policy for 10 MiB evidence + bounded multipart envelope (§6.2).
  location /api/v1/evidence {
    client_max_body_size 11m;
    client_body_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    proxy_hide_header X-Content-Type-Options;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "private, no-store, no-transform" always;

    proxy_pass http://api:3001;
  }

  # Exact /api/v1 root without trailing slash routes to NestJS API rather than Next.js.
  location = /api/v1 {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;

    proxy_hide_header X-Content-Type-Options;
    add_header X-Content-Type-Options "nosniff" always;

    proxy_pass http://api:3001;
  }

  # All other NestJS API endpoints — uncached, strict header overwrite.
  location /api/v1/ {
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    proxy_hide_header X-Content-Type-Options;
    add_header X-Content-Type-Options "nosniff" always;

    proxy_pass http://api:3001;
  }

  # Immutable hashed Next.js UI assets (§6.2).
  location /_next/static/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;

    proxy_pass http://web:3000;
  }

  # Dynamic Next.js application routes.
  location / {
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    proxy_hide_header X-Content-Type-Options;
    add_header X-Content-Type-Options "nosniff" always;

    proxy_pass http://web:3000;
  }
}
