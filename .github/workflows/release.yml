name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-and-test:
    name: Pre-Release Quality, Integration, BDD & Security Gates
    if: >-
      github.repository == 'KontentWave/qa-evidence-hub' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enable pinned pnpm via Corepack
        run: corepack enable pnpm

      - name: Setup Node.js 24 LTS with pnpm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality, contract, coverage, integration, BDD, secret, static, dependency, and license gates
        run: |
          pnpm verify:digests
          pnpm verify:workflows
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm openapi:check
          pnpm test
          pnpm test:coverage
          pnpm build
          pnpm test:integration
          pnpm test:bdd:foundation
          pnpm verify:security:secrets
          pnpm verify:security:static
          pnpm verify:security:deps
          pnpm verify:licenses

  build-scan-smoke-publish:
    name: Build Once, Scan, Smoke-Test, SBOM & Publish Private GHCR
    needs:
      - verify-and-test
    if: >-
      github.repository == 'KontentWave/qa-evidence-hub' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Verify authorized trusted ref
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "pull_request_target" ]; then
            echo "Release workflow must never execute on pull_request events" >&2
            exit 1
          fi
          if ! printf '%s' "${GITHUB_REF}" | grep -Eq '^refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$'; then
            echo "Unauthorized or malformed ref for image publishing: ${GITHUB_REF}" >&2
            exit 1
          fi
          echo "Authorized trusted ref verified: ${GITHUB_REF} (${GITHUB_SHA})"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable pinned pnpm via Corepack
        run: corepack enable pnpm

      - name: Setup Node.js 24 LTS with pnpm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright headless Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify GHCR packages exist and enforce private visibility BEFORE build or push
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          node scripts/verify-ghcr-privacy.mjs pre-push --owner "${OWNER_LC}"

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve existing sha-<short> GHCR digest or build production images ONCE
        id: build_once
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-12)
          API_REPO="ghcr.io/${OWNER_LC}/qa-evidence-hub-api"
          WEB_REPO="ghcr.io/${OWNER_LC}/qa-evidence-hub-web"
          API_SHA_TAG="${API_REPO}:sha-${SHORT_SHA}"
          WEB_SHA_TAG="${WEB_REPO}:sha-${SHORT_SHA}"

          EXISTING_JSON=$(node scripts/verify-ghcr-privacy.mjs resolve-existing-sha --owner "${OWNER_LC}" --short-sha "${SHORT_SHA}")
          REUSED_EXISTING=$(echo "${EXISTING_JSON}" | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(String(Boolean(d.reusedExisting)));')
          EXISTING_API_DIGEST=$(echo "${EXISTING_JSON}" | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(d.apiDigest || "");')
          EXISTING_WEB_DIGEST=$(echo "${EXISTING_JSON}" | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(d.webDigest || "");')

          if [ "${REUSED_EXISTING}" = "true" ]; then
            echo "Reusing already-published immutable GHCR commit artifacts for sha-${SHORT_SHA}: api=${EXISTING_API_DIGEST}, web=${EXISTING_WEB_DIGEST}"
            docker pull "${API_REPO}@${EXISTING_API_DIGEST}"
            docker tag "${API_REPO}@${EXISTING_API_DIGEST}" "${API_SHA_TAG}"
            docker pull "${WEB_REPO}@${EXISTING_WEB_DIGEST}"
            docker tag "${WEB_REPO}@${EXISTING_WEB_DIGEST}" "${WEB_SHA_TAG}"
          else
            if [ -n "${EXISTING_API_DIGEST}" ] || [ -n "${EXISTING_WEB_DIGEST}" ]; then
              echo "Partial sha-${SHORT_SHA} state detected (api=${EXISTING_API_DIGEST:-missing}, web=${EXISTING_WEB_DIGEST:-missing}); refusing inconsistent overwrite." >&2
              exit 1
            fi
            docker build --target runner -f apps/api/Dockerfile -t "${API_SHA_TAG}" .
            docker build --target runner -f apps/web/Dockerfile -t "${WEB_SHA_TAG}" .
          fi

          API_LOCAL_ID=$(docker image inspect "${API_SHA_TAG}" --format '{{.Id}}')
          WEB_LOCAL_ID=$(docker image inspect "${WEB_SHA_TAG}" --format '{{.Id}}')

          {
            echo "owner_lc=${OWNER_LC}"
            echo "short_sha=${SHORT_SHA}"
            echo "api_repo=${API_REPO}"
            echo "web_repo=${WEB_REPO}"
            echo "api_sha_tag=${API_SHA_TAG}"
            echo "web_sha_tag=${WEB_SHA_TAG}"
            echo "api_local_id=${API_LOCAL_ID}"
            echo "web_local_id=${WEB_LOCAL_ID}"
            echo "reused_existing=${REUSED_EXISTING}"
            echo "existing_api_digest=${EXISTING_API_DIGEST}"
            echo "existing_web_digest=${EXISTING_WEB_DIGEST}"
          } >> "${GITHUB_OUTPUT}"

      - name: Scan API, Web, Nginx, and PostgreSQL images for HIGH/CRITICAL vulnerabilities and secrets
        env:
          PREBUILT_API_IMAGE: ${{ steps.build_once.outputs.api_sha_tag }}
          PREBUILT_WEB_IMAGE: ${{ steps.build_once.outputs.web_sha_tag }}
        run: pnpm verify:security:containers

      - name: Generate SPDX 2.3 SBOMs for API and Web image artifacts
        id: sbom
        env:
          API_SHA_TAG: ${{ steps.build_once.outputs.api_sha_tag }}
          WEB_SHA_TAG: ${{ steps.build_once.outputs.web_sha_tag }}
        run: |
          mkdir -p release-artifacts
          API_SBOM_META=$(node scripts/security-scan.mjs sbom "${API_SHA_TAG}" release-artifacts/qa-evidence-hub-api.spdx.json)
          WEB_SBOM_META=$(node scripts/security-scan.mjs sbom "${WEB_SHA_TAG}" release-artifacts/qa-evidence-hub-web.spdx.json)

          API_SBOM_SHA=$(echo "${API_SBOM_META}" | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(d.sha256);')
          API_SBOM_PKGS=$(echo "${API_SBOM_META}" | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(String(d.packageCount));')
          WEB_SBOM_SHA=$(echo "${WEB_SBOM_META}" | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(d.sha256);')
          WEB_SBOM_PKGS=$(echo "${WEB_SBOM_META}" | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(String(d.packageCount));')

          {
            echo "api_sbom_sha256=${API_SBOM_SHA}"
            echo "api_sbom_packages=${API_SBOM_PKGS}"
            echo "web_sbom_sha256=${WEB_SBOM_SHA}"
            echo "web_sbom_packages=${WEB_SBOM_PKGS}"
          } >> "${GITHUB_OUTPUT}"

      - name: Smoke-test those exact API and Web image artifacts through Nginx (F01 + Playwright)
        env:
          PREBUILT_API_IMAGE: ${{ steps.build_once.outputs.api_sha_tag }}
          PREBUILT_WEB_IMAGE: ${{ steps.build_once.outputs.web_sha_tag }}
        run: |
          node --test scripts/f01-containers.test.mjs
          pnpm test:e2e:foundation

      - name: Publish or promote tested image artifacts to GHCR without mutating sha-<short>
        id: publish
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_LC: ${{ steps.build_once.outputs.owner_lc }}
          API_SHA_TAG: ${{ steps.build_once.outputs.api_sha_tag }}
          WEB_SHA_TAG: ${{ steps.build_once.outputs.web_sha_tag }}
          API_REPO: ${{ steps.build_once.outputs.api_repo }}
          WEB_REPO: ${{ steps.build_once.outputs.web_repo }}
          EXPECTED_API_ID: ${{ steps.build_once.outputs.api_local_id }}
          EXPECTED_WEB_ID: ${{ steps.build_once.outputs.web_local_id }}
          REUSED_EXISTING: ${{ steps.build_once.outputs.reused_existing }}
          EXISTING_API_DIGEST: ${{ steps.build_once.outputs.existing_api_digest }}
          EXISTING_WEB_DIGEST: ${{ steps.build_once.outputs.existing_web_digest }}
        run: |
          # Verify local image IDs did not mutate between build/pull, scan, and smoke test.
          test "$(docker image inspect "${API_SHA_TAG}" --format '{{.Id}}')" = "${EXPECTED_API_ID}"
          test "$(docker image inspect "${WEB_SHA_TAG}" --format '{{.Id}}')" = "${EXPECTED_WEB_ID}"

          if [ "${REUSED_EXISTING}" = "true" ]; then
            API_DIGEST="${EXISTING_API_DIGEST}"
            WEB_DIGEST="${EXISTING_WEB_DIGEST}"
            API_REPO_DIGEST="${API_REPO}@${API_DIGEST}"
            WEB_REPO_DIGEST="${WEB_REPO}@${WEB_DIGEST}"
          else
            docker push "${API_SHA_TAG}"
            docker push "${WEB_SHA_TAG}"
            API_REPO_DIGEST=$(docker image inspect "${API_SHA_TAG}" --format '{{index .RepoDigests 0}}')
            WEB_REPO_DIGEST=$(docker image inspect "${WEB_SHA_TAG}" --format '{{index .RepoDigests 0}}')
            API_DIGEST="${API_REPO_DIGEST#*@}"
            WEB_DIGEST="${WEB_REPO_DIGEST#*@}"
          fi

          EXTRA_TAG=""
          case "${GITHUB_REF}" in
            refs/tags/v*)
              EXTRA_TAG="${GITHUB_REF#refs/tags/}"
              node scripts/verify-ghcr-privacy.mjs alias-tag \
                --owner "${OWNER_LC}" \
                --package qa-evidence-hub-api \
                --digest "${API_DIGEST}" \
                --tag "${EXTRA_TAG}"
              node scripts/verify-ghcr-privacy.mjs alias-tag \
                --owner "${OWNER_LC}" \
                --package qa-evidence-hub-web \
                --digest "${WEB_DIGEST}" \
                --tag "${EXTRA_TAG}"
              ;;
          esac

          {
            echo "extra_tag=${EXTRA_TAG}"
            echo "api_repo_digest=${API_REPO_DIGEST}"
            echo "web_repo_digest=${WEB_REPO_DIGEST}"
            echo "api_digest=${API_DIGEST}"
            echo "web_digest=${WEB_DIGEST}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify published GHCR digests and tags are reachable authenticated and conclusively denied anonymously
        id: visibility
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_LC: ${{ steps.build_once.outputs.owner_lc }}
          API_SHA_TAG: ${{ steps.build_once.outputs.api_sha_tag }}
          WEB_SHA_TAG: ${{ steps.build_once.outputs.web_sha_tag }}
          EXTRA_TAG: ${{ steps.publish.outputs.extra_tag }}
          API_DIGEST: ${{ steps.publish.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.publish.outputs.web_digest }}
        run: |
          API_TAGS="${API_SHA_TAG}${EXTRA_TAG:+,${EXTRA_TAG}}"
          WEB_TAGS="${WEB_SHA_TAG}${EXTRA_TAG:+,${EXTRA_TAG}}"
          POST_PUSH_JSON=$(node scripts/verify-ghcr-privacy.mjs post-push \
            --owner "${OWNER_LC}" \
            --api-digest "${API_DIGEST}" \
            --web-digest "${WEB_DIGEST}" \
            --api-tags "${API_TAGS}" \
            --web-tags "${WEB_TAGS}")
          echo "${POST_PUSH_JSON}"

          API_ANON_HTTP=$(echo "${POST_PUSH_JSON}" | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(String(d.results[0].anonymousPullHttpStatus));')
          WEB_ANON_HTTP=$(echo "${POST_PUSH_JSON}" | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(String(d.results[1].anonymousPullHttpStatus));')

          {
            echo "api_anon_http=${API_ANON_HTTP}"
            echo "web_anon_http=${WEB_ANON_HTTP}"
          } >> "${GITHUB_OUTPUT}"

      - name: Record release provenance linking manifest digests to commit, passing test run, and SBOMs
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_REPO: ${{ steps.build_once.outputs.api_repo }}
          WEB_REPO: ${{ steps.build_once.outputs.web_repo }}
          API_SHA_TAG: ${{ steps.build_once.outputs.api_sha_tag }}
          WEB_SHA_TAG: ${{ steps.build_once.outputs.web_sha_tag }}
          REUSED_EXISTING: ${{ steps.build_once.outputs.reused_existing }}
          EXTRA_TAG: ${{ steps.publish.outputs.extra_tag }}
          API_LOCAL_ID: ${{ steps.build_once.outputs.api_local_id }}
          WEB_LOCAL_ID: ${{ steps.build_once.outputs.web_local_id }}
          API_DIGEST: ${{ steps.publish.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.publish.outputs.web_digest }}
          API_REPO_DIGEST: ${{ steps.publish.outputs.api_repo_digest }}
          WEB_REPO_DIGEST: ${{ steps.publish.outputs.web_repo_digest }}
          API_SBOM_SHA256: ${{ steps.sbom.outputs.api_sbom_sha256 }}
          API_SBOM_PACKAGES: ${{ steps.sbom.outputs.api_sbom_packages }}
          WEB_SBOM_SHA256: ${{ steps.sbom.outputs.web_sbom_sha256 }}
          WEB_SBOM_PACKAGES: ${{ steps.sbom.outputs.web_sbom_packages }}
          API_ANON_HTTP: ${{ steps.visibility.outputs.api_anon_http }}
          WEB_ANON_HTTP: ${{ steps.visibility.outputs.web_anon_http }}
        run: |
          node -e '
            const fs = require("node:fs");
            const extraTag = process.env.EXTRA_TAG;
            const apiAnon = Number(process.env.API_ANON_HTTP);
            const webAnon = Number(process.env.WEB_ANON_HTTP);
            const apiTags = [process.env.API_SHA_TAG, ...(extraTag ? [`${process.env.API_REPO}:${extraTag}`] : [])];
            const webTags = [process.env.WEB_SHA_TAG, ...(extraTag ? [`${process.env.WEB_REPO}:${extraTag}`] : [])];
            const provenance = {
              schemaVersion: "1.1.0",
              generatedAtUtc: new Date().toISOString(),
              repository: process.env.GITHUB_REPOSITORY,
              commitSha: process.env.GITHUB_SHA,
              trustedRef: process.env.GITHUB_REF,
              reusedExistingCommitArtifacts: process.env.REUSED_EXISTING === "true",
              passingVerificationRun: {
                workflow: process.env.GITHUB_WORKFLOW,
                runId: Number(process.env.GITHUB_RUN_ID),
                runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
                runUrl: process.env.RUN_URL,
                preReleaseGatesJob: "Pre-Release Quality, Integration, BDD & Security Gates (PASS)",
                artifactSmokeChecks: [
                  "scripts/verify-ghcr-privacy.mjs pre-push (PASS)",
                  "scripts/f01-containers.test.mjs (PASS)",
                  "e2e/foundation-smoke.spec.ts (PASS)",
                  "scripts/security-scan.mjs containers (PASS)",
                  "scripts/verify-ghcr-privacy.mjs post-push (PASS)"
                ]
              },
              images: {
                api: {
                  package: process.env.API_REPO,
                  visibility: "private",
                  anonymousPullHttpStatus: apiAnon,
                  tags: apiTags,
                  localImageId: process.env.API_LOCAL_ID,
                  registryManifestDigest: process.env.API_DIGEST,
                  immutablePullRef: process.env.API_REPO_DIGEST,
                  sbom: {
                    artifactFile: "qa-evidence-hub-api.spdx.json",
                    format: "SPDX-2.3",
                    sha256: process.env.API_SBOM_SHA256,
                    packageCount: Number(process.env.API_SBOM_PACKAGES)
                  }
                },
                web: {
                  package: process.env.WEB_REPO,
                  visibility: "private",
                  anonymousPullHttpStatus: webAnon,
                  tags: webTags,
                  localImageId: process.env.WEB_LOCAL_ID,
                  registryManifestDigest: process.env.WEB_DIGEST,
                  immutablePullRef: process.env.WEB_REPO_DIGEST,
                  sbom: {
                    artifactFile: "qa-evidence-hub-web.spdx.json",
                    format: "SPDX-2.3",
                    sha256: process.env.WEB_SBOM_SHA256,
                    packageCount: Number(process.env.WEB_SBOM_PACKAGES)
                  }
                }
              }
            };
            fs.writeFileSync("release-artifacts/release-provenance.json", JSON.stringify(provenance, null, 2) + "\n");
            const summary = [
              "## Release Artifact Provenance & SBOM Linkage",
              `- **Commit SHA:** \`${provenance.commitSha}\``,
              `- **Trusted Ref:** \`${provenance.trustedRef}\` (reused commit artifacts: \`${provenance.reusedExistingCommitArtifacts}\`)`,
              `- **Passing Test & Smoke Run:** [${provenance.passingVerificationRun.runId}](${provenance.passingVerificationRun.runUrl})`,
              "",
              "| Component | Immutable GHCR Manifest Ref | Verified Visibility (Anon OCI Denial) | SPDX SBOM Artifact (`SHA-256`) |",
              "| :--- | :--- | :--- | :--- |",
              `| \`api\` | \`${provenance.images.api.immutablePullRef}\` | \`private\` (\`HTTP ${apiAnon}\`) | \`qa-evidence-hub-api.spdx.json\` (\`${provenance.images.api.sbom.sha256}\`, ${provenance.images.api.sbom.packageCount} pkgs) |`,
              `| \`web\` | \`${provenance.images.web.immutablePullRef}\` | \`private\` (\`HTTP ${webAnon}\`) | \`qa-evidence-hub-web.spdx.json\` (\`${provenance.images.web.sbom.sha256}\`, ${provenance.images.web.sbom.packageCount} pkgs) |`,
              ""
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          '
          (cd release-artifacts && sha256sum qa-evidence-hub-api.spdx.json qa-evidence-hub-web.spdx.json release-provenance.json > sha256sums.txt)

      - name: Retain SBOMs and release provenance manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sboms-and-provenance-${{ github.sha }}-${{ github.run_id }}
          path: |
            release-artifacts/qa-evidence-hub-api.spdx.json
            release-artifacts/qa-evidence-hub-web.spdx.json
            release-artifacts/release-provenance.json
            release-artifacts/sha256sums.txt
          if-no-files-found: error
          retention-days: 90
