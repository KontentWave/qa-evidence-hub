services:
  postgres_test:
    image: postgres:19-bookworm@sha256:f4859caf96de494e38efa69ed703b08a5bbd9605e152e604f2daec8841c87c41
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=30
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-qaeh_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-qaeh_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-qaeh_test_ephemeral}
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - test_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s

networks:
  test_net:
    internal: false

volumes:
  postgres_test_data:
